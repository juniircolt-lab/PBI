" rows="3"></textarea></label><footer><button type="button" id="delete">Excluir atividade</button><button class="primary">Salvar atividade</button></footer></form></dialog><datalist id="projects"></datalist><input type="file" id="file" accept=".json,application/json" hidden><script src="js/storage.js"></script><script src="js/app.js"></script></body></html>
